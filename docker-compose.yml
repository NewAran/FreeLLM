services:
  freellm:
    build: .
    image: ghcr.io/newaran/freellm:latest
    container_name: freellm
    restart: unless-stopped
    ports:
      - "${FREELLM_PORT:-8080}:8080"
    environment:
      FREELLM_DATA_DIR: /data
      FREELLM_REQUEST_TIMEOUT: ${FREELLM_REQUEST_TIMEOUT:-90}
    volumes:
      - freellm-data:/data

volumes:
  freellm-data:
